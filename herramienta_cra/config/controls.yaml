# config/controls.yaml
# Configuración de Auditoría CRA - Perfil Servidor Linux General


project:
  nombre: "CRA Ubuntu Auditor"
  # history_enabled: true  # POR DETERMINAR
  storage_path: "output"


#
network:
  white_list:
    - "ssh"
    - "http"
    - "https"
    - "ipp"         
    - "postgresql"
    - "mysql"
    - "domain"      # DNS

  black_list:
    "ftp": "Tráfico en texto plano. Usar SFTP."
    "telnet": "Acceso remoto inseguro. Usar SSH."
    "vnc": "Escritorio remoto no cifrado por defecto."
    "exec": "Comando remoto legacy."
    "login": "Login remoto legacy."
    "shell": "Shell remota legacy."
    "unknown": "Servicio desconocido o sospechoso (Posible Netcat/Listener crudo)."
    "bindshell": "Shell remota."
    "echo": "A menudo usado por Netcat."

# (Anexo I.1.2 - Gestión de vulnerabilidades)
vulnerabilities: 
  min_cvss_score: 7.0 # Reportar vulns de riesgo alto
  ignorar: [] # Paquetes de riesgo asumido
  timeout: 30 


#(Anexo I.1.2 - Gestión de identidades)
system: 
  critical_files:
    - path: "/etc/shadow"
      max_permissions: "640" # rw-r-----
      owner: "root"

    - path: "/etc/passwd"
      max_permissions: "644" # rw-r--r--
      owner: "root"

    - path: "/etc/ssh/sshd_config"
      max_permissions: "600" # rw-------
      owner: "root"

    - path: "/etc/crontab"
      max_permissions: "644"
      owner: "root"

    - path: "/etc/sudoers" 
      max_permissions: "440"
      owner: "root"

    - path: "/boot/grub/grub.cfg" 
      max_permissions: "440"
      owner: "root"

  users:
    check_root_locked: false # En Ubuntu cloud a veces root está bloqueado (passwd -l)
    disallow_empty_passwords: true
    max_password_days: 90
    min_uid_users: 1000

  updates:
    check_unattended_upgrades: true 
    check_days_since_last_update: 7


# (Anexo I.1.3 - Integridad de datos y sistema)
integrity: 
  monitored_binaries:
    - "/bin/ls"
    - "/bin/ps"
    - "/bin/netstat"
    - "/bin/login"
    - "/usr/bin/sudo"
    - "/usr/sbin/sshd"

  monitored_configs:
    - "/etc/hosts"
    - "/etc/resolv.conf"
    - "/etc/fstab"


# (Anexo I.1.4 - Confidencialidad)
hardening: 
  ssh:
    permit_root_login: ["no", "prohibit-password"]
    password_authentication: "no"
    protocol: "2"
  firewall:
    check_active: true
    allowed_tools: ["ufw", "iptables"]


# (Anexo I.1.4 - Confidencialidad)
encryption: 
  algoritmo: "sha256"
  comp_luks: true
  critical_mounts: ["/", "/home", "/var"]


# (Anexo I.1.5 - Resiliencia)
backups: 
  comp_crontab: true
  comp_systemd_timers: true
  keywords: ["backup", "rsync", "tar", "snapshot", "aws s3", "rclone"]
